# French strings. Select them by listing this file next to utility-bridge-common.yaml,
# in your per-install config's `packages:` block:
#
#   packages:
#     vmc:
#       url: https://github.com/cdamman/ESPHome-Zehnder-RF
#       files: [translations/fr.yaml, utility-bridge-common.yaml]
#
# The committed utility-bridge-d1-mini.yaml does exactly that -- it is the author's
# own unit. English (translations/en.yaml) is the project default and the reference
# list this file has to keep up with.
#
# Overriding a single string does not require editing this file -- set the same key
# in your per-install config's own substitutions, which take precedence over a
# package.

substitutions:
  # Modes of the fan entity. The number is part of the label so Home Assistant and
  # Google Home list them in order. No "0 - Off": this unit has no stop mode in
  # practice, only three running speeds.
  mode_low: "1 - Bas"
  mode_medium: "2 - Normal"
  mode_high: "3 - Fort"

  # Boost
  name_timer_duration: "Durée du minuteur"
  name_timer_remaining: "Minuteur restant"

  # Filtres. « État des filtres » nomme la chose mesurée ; son device_class problem
  # fournit la valeur (« Problème » / « OK »), donc l'entité se lit « État des
  # filtres : Problème » sans que le libellé ait à porter l'alerte lui-même.
  name_filter_interval: "Intervalle de changement des filtres"
  name_filter_due_on: "Changement des filtres prévu le"
  name_filter_life: "Durée de vie des filtres"
  name_filter_due: "État des filtres"
  name_filter_reset: "Filtres changés"

  # Consumption
  name_power: "Consommation actuelle"
  name_energy_today: "Consommation d'aujourd'hui"
  name_airflow: "Débit"
  name_power_low: "Puissance 1 - Bas"
  name_power_medium: "Puissance 2 - Normal"
  name_power_high: "Puissance 3 - Fort"

  # Diagnostics. Tout ce qui concerne la liaison RF -- y compris la santé de la
  # liaison SPI avec la puce nRF905 elle-même -- est préfixé "RF: ", pour qu'ils
  # se regroupent visuellement. Le signal WiFi et le reste des diagnostics
  # système restent sans préfixe, étant d'une autre nature.
  name_pairing: "Réappairer"
  name_restart: "Redémarrer"
  name_spi_healthy: "RF: Connexion SPI"
  name_rf_channel_busy: "RF: Occupation du canal"
  name_rf_frames_received: "RF: Trames reçues"
  name_rf_frames_sent: "RF: Trames envoyées"
  name_rf_crc_errors: "RF: Erreurs CRC"
  name_poll_success: "RF: Taux de réponse de l'unité"
  name_wifi_signal: "Signal WiFi"
  name_boot_time: "Démarré le"
  name_ip_address: "Adresse IP"
  name_network_id: "RF: ID réseau"
  name_main_unit_id: "RF: ID de l'unité"
  name_controller_id: "RF: ID télécommande"
  # Quatre entités pour deux événements : ce qui a été demandé et par qui, ce qui a
  # répondu et de qui. Séparées plutôt que concaténées, parce qu'une entité par
  # fait se filtre, se trace et se lit dans un tableau de bord ; recoller les deux
  # est l'affaire d'un template si besoin.
  #
  # Le préfixe porte l'ordre, pas seulement le sens. Home Assistant trie les
  # entités d'une section par nom, et il n'y a aucun moyen de lui imposer un ordre
  # ailleurs -- donc « RF Com: » avant « RF Resp: » (C avant R) place la paire
  # commande avant la paire réponse, et à l'intérieur d'une paire le libellé suivant
  # fait le reste : Dernière commande avant Envoyée par, Dernière réponse avant
  # Reçue de. Renommer un de ces quatre libellés, c'est donc décider de sa place.
  #
  # Le sens est déjà dans « Com » / « Resp », donc les libellés n'ont pas de flèche :
  # ce sont les icônes qui la portent (message-arrow-right-outline vers l'unité,
  # message-arrow-left-outline au retour), partagées par les deux entités d'une même
  # paire pour qu'elles se lisent comme un couple.
  name_last_command: "RF Com: Dernière commande"
  name_last_command_from: "RF Com: Envoyée par"
  name_last_answer: "RF Resp: Dernière réponse"
  name_last_answer_from: "RF Resp: Reçue de"

  # Types de trame, tels qu'affichés par les deux entités « quoi » : « <nom> (<hex>)
  # », soit « Réglage de vitesse (0x02) ». L'octet reste affiché parce que c'est lui
  # qu'on retrouve dans les logs et dans la documentation du protocole -- écrit 0x02
  # comme eux -- et le nom est là pour ne pas avoir à les relire.
  #
  # Deux listes disjointes : les trames de réponse (0x05, 0x07, 0x0C, 0x1D) ne peuvent
  # apparaître que côté réponse, et les autres que côté commande -- c'est le
  # composant qui trie.
  value_frame_set_voltage: "Réglage de tension"
  value_frame_set_speed: "Réglage de vitesse"
  value_frame_set_timer: "Réglage avec minuteur"
  value_frame_join_request: "Demande d'appairage"
  value_frame_join_open: "Appairage ouvert"
  value_frame_0b: "Trame non documentée"
  value_frame_query_network: "Interrogation réseau"
  value_frame_query: "Interrogation"

  value_frame_set_speed_reply: "Vitesse confirmée"
  value_frame_settings: "Réglages"
  value_frame_join_ack: "Appairage confirmé"
  value_frame_set_voltage_reply: "Tension confirmée"

  # Pour un octet que le décodeur ne connaît pas : le nom manque, l'octet reste.
  value_frame_unknown: "Trame inconnue"

  # Appareils, tels qu'affichés par les deux entités « qui » : « <nom> (<ID>) », soit
  # « Télécommande (0x06) » -- même forme que les types de trame ci-dessus, pour que
  # les quatre valeurs se lisent de la même façon. La préposition est dans le
  # libellé (« Envoyée par »,
  # « Reçue de »), donc les noms sont nus et servent aux deux.
  #
  # L'unité appairée est distinguée de toute autre unité du réseau, parce que voir
  # « Autre unité » est une surprise bien plus intéressante. Les quatre entités
  # repassent à « inconnu » dès que leur enregistrement est périmé (une demi-période
  # d'interrogation), donc il n'y a pas de texte « rien pour l'instant » à traduire.
  # « Cette télécommande » et pas « ce contrôleur » : pour le protocole, ce montage
  # *est* une télécommande, type d'appareil 0x03, exactement comme celle du mur --
  # l'unité ne fait aucune différence entre les deux.
  value_device_us: "Cette télécommande"
  value_device_main_unit: "Unité"
  value_device_other_unit: "Autre unité"
  value_device_remote: "Télécommande"
  value_device_co2: "Capteur CO2"
  value_device_unknown: "Appareil inconnu"
