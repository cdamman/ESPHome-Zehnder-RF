# Minimal config used only by CI to compile-test the local components on ESP8266.
# No wifi / api / ota / secrets needed for a compile check.
esphome:
  name: ci-test-esp8266
  comment: CI compile test (ESP8266)

esp8266:
  board: d1_mini
  restore_from_flash: true

logger:
  level: DEBUG

# Build the components from this repo (not from GitHub), so CI tests the
# code under review.
external_components:
  - source:
      type: local
      path: ../components

# The Wemos D1 mini pins of vmc-d1-mini.yaml (nRF905-API's table): no AM, no CD.
spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  miso_pin: GPIO12

nrf905:
  id: nrf905_rf
  cs_pin: GPIO15
  ce_pin: GPIO4
  pwr_pin: GPIO0
  txen_pin: GPIO16
  dr_pin: GPIO5

fan:
  - platform: zehnder
    id: zehnder_fan
    name: "Ventilation"
    nrf905: nrf905_rf
    update_interval: "60s"
    model: zehnder
    preset_modes:
      "0 - Off": "off"
      "1 - Bas": low
      "2 - Normal": medium
      "3 - Fort": high
    boost_speed: high
    revert_speed: medium
    boost_duration: 30min

# Exercise the boost / timer API the way vmc.yaml drives it, so a signature
# change breaks CI instead of a user's build.
number:
  - platform: template
    name: "Timer duration"
    id: timer_minutes
    optimistic: true
    restore_value: true
    initial_value: 30
    min_value: 1
    max_value: 240
    step: 1
    on_value:
      - lambda: "id(zehnder_fan)->set_timer_minutes((uint8_t) x);"

  # Per-speed power figures, as vmc.yaml exposes them to Home Assistant.
  - platform: template
    name: "Power off"
    id: power_off
    optimistic: true
    restore_value: true
    initial_value: 0.0
    min_value: 0
    max_value: 10000
    step: 0.5
  - platform: template
    name: "Power low"
    id: power_low
    optimistic: true
    restore_value: true
    initial_value: 13.0
    min_value: 0
    max_value: 10000
    step: 0.5
  - platform: template
    name: "Power medium"
    id: power_medium
    optimistic: true
    restore_value: true
    initial_value: 28.0
    min_value: 0
    max_value: 10000
    step: 0.5
  - platform: template
    name: "Power high"
    id: power_high
    optimistic: true
    restore_value: true
    initial_value: 58.5
    min_value: 0
    max_value: 10000
    step: 0.5

button:
  - platform: template
    name: "Boost"
    on_press:
      - lambda: "id(zehnder_fan)->startBoost(0);"
  - platform: template
    name: "Cancel boost"
    on_press:
      - lambda: "id(zehnder_fan)->cancelBoost();"

binary_sensor:
  - platform: template
    name: "Timer active"
    lambda: "return id(zehnder_fan)->isTimerActive();"

sensor:
  - platform: template
    name: "Timer remaining"
    unit_of_measurement: min
    update_interval: 30s
    lambda: "return id(zehnder_fan)->getTimerRemainingMinutes();"
  - platform: template
    name: "Fan percentage"
    unit_of_measurement: "%"
    update_interval: 60s
    lambda: "return id(zehnder_fan)->getFanPercentage();"
  - platform: template
    name: "Fan flags"
    entity_category: diagnostic
    update_interval: 60s
    lambda: "return id(zehnder_fan)->getFanFlags();"

  # Same power sensor as vmc.yaml, so CI covers that shape too. The
  # total_daily_energy sensor built on it needs a time source (and so a network),
  # which this deliberately network-free config does not set up.
  - platform: template
    name: "Power"
    id: fan_power
    device_class: power
    state_class: measurement
    unit_of_measurement: W
    update_interval: 30s
    lambda: |-
      auto *vmc = id(zehnder_fan);
      switch (vmc->speed) {
        case 0: return id(power_off).state;  // stopped, but still wired
        case 1: return id(power_low).state;
        case 2: return id(power_medium).state;
        default: return id(power_high).state;  // speed 4 has no mode here
      }

