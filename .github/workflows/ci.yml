name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Allow Dependabot ESPHome bumps to be compile-tested via the PR trigger above.
  workflow_dispatch:

jobs:
  compile:
    name: Compile components (${{ matrix.config }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: [tests/ci.yaml, tests/ci-esp8266.yaml]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ESPHome (pinned)
        run: pip install -r requirements.txt

      # Cache the ESP32 toolchain / platformio packages so subsequent runs are fast.
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
            tests/.esphome
          key: esphome-${{ matrix.config }}-${{ hashFiles('requirements.txt', matrix.config) }}
          restore-keys: |
            esphome-${{ matrix.config }}-
            esphome-

      - name: Compile
        run: esphome compile ${{ matrix.config }}

  translations:
    name: Validate every language and board, and compile one for real
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ESPHome (pinned)
        run: pip install -r requirements.txt

      # For the compile step at the end of this job.
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
            .esphome
          key: esphome-assembled-${{ hashFiles('requirements.txt', 'utility-bridge-common.yaml') }}
          restore-keys: |
            esphome-assembled-
            esphome-

      # The config reads credentials from secrets.yaml, which is not in the repo.
      # `esphome config` only needs the keys to exist.
      - name: Write a throwaway secrets.yaml
        run: |
          {
            echo 'wifi_ssid: "ci"'
            echo 'wifi_password: "ci-password"'
            echo "esphome_vmc_api_key: \"$(head -c 32 /dev/urandom | base64 -w0)\""
            echo 'esphome_vmc_ota_password: "ci-password"'
          } > secrets.yaml

      # esphome only warns about an unresolved ${...} and keeps the literal text as
      # the entity name, so the label check is its own script.
      - name: Every language provides every label
        run: python3 tests/check_translations.py

      # Each per-install config pulls utility-bridge-common.yaml and the component
      # from GitHub; tests/local_config.py points both at this checkout, so a pull
      # request is validated against its own changes rather than against what is
      # already on main.
      - name: Validate the config in every language, for every board
        run: |
          for device in utility-bridge-d1-mini.yaml utility-bridge-esp32.yaml; do
            for lang in translations/*.yaml; do
              echo "== $device / $lang"
              python3 tests/local_config.py "$lang" "$device" > vmc-local.yaml
              esphome config vmc-local.yaml > /dev/null
            done
          done

      # `esphome config` does not compile lambdas, and the two tests/ci*.yaml
      # configs are standalone -- they never include utility-bridge-common.yaml. So
      # every lambda in it (the filter count-down, the consumption switch, the
      # count-down sensors) went straight from a pull request to someone's board
      # without ever being built. This compiles the assembled config for real.
      #
      # One board and one language is enough: the lambdas are identical across both
      # boards, and a language only changes the strings around them.
      - name: Compile the assembled config
        run: |
          python3 tests/local_config.py translations/en.yaml utility-bridge-d1-mini.yaml > vmc-local.yaml
          esphome compile vmc-local.yaml
