# The VMC side of an nRF905-controlled Zehnder / BUVA ventilation unit -- the
# ESPHome equivalent of the "nRF905 VMC" Home Assistant integration, without the
# HTTP bridge in between: the ESP talks to the ventilation unit directly.
#
#   * the named modes (1 - Low / 2 - Normal / 3 - High);
#   * a boost on the entity's own on/off, with a duration set from Home Assistant;
#   * the count-down of the running timer;
#   * present and daily power consumption, at watts set from Home Assistant.
#
# No percentage slider: the unit has three fixed speeds, so the modes are the
# interface. The Airflow sensor stays, as a reading of what the unit reports rather
# than a way to drive it.
#
# This file holds only that: the fan and the entities around it. Nothing about a
# board, its pins, or the network lives here -- that is what an ESPHome config
# already has to declare for itself (see utility-bridge-d1-mini.yaml or
# utility-bridge-esp32.yaml), whatever the hardware. This is
# the part that stays the same across installs, so it is meant to be pulled in as
# a package rather than copied: an update here arrives with the next build instead
# of another copy-paste.
#
# It deliberately does *not* choose a language: the labels come from whichever
# translations/*.yaml is merged alongside it, which is the caller's call. On its
# own, every ${name_*} below would stay unresolved. `devicename` is the same way --
# set by the config that pulls this one in, since that config needs it too (its own
# `esphome:` block).
#
# Defaults for the values a single install may want to change. Every one of them can
# be set again in the file that pulls this one in: substitutions of the including
# config win over those of a package.
substitutions:
  # Starting value of the per-speed power figures, in watts -- the defaults of the
  # Home Assistant integration. They are only the initial values: each one is a
  # number entity, so the figures are set from Home Assistant and kept there.
  power_low: "13.0"
  power_medium: "28.0"
  power_high: "58.5"

  # Starting value of the filter-change interval, in months -- also only an
  # initial value: it is a number entity, set from Home Assistant afterwards.
  filter_interval_months: "3"

  # What a "month" means to the deadline. The average Gregorian month, so a
  # 3-month interval is 91 days and a 12-month one lands within a day of the year.
  # Calendar months would be more exact and less predictable (a February reset
  # would shorten the interval); for a filter, a fixed 30.44 is both simpler to
  # reason about and close enough. Set it to 30 or 31 if you prefer round numbers.
  filter_days_per_month: "30.44"

# Flash writes are batched every 5 minutes instead of the default 60 seconds. The
# daily-energy total changes constantly and is saved on every publish, and several
# `number` entities restore their value at boot too, so the default cadence adds up
# to a lot of write cycles over the years, on any board. The cost is a window of up
# to 5 minutes: a power cut can lose the last edit of a number, a few minutes of the
# daily total, or a pairing that was just established. Pinning the pairing (see your
# per-install config) makes that last one moot.
preferences:
  flash_write_interval: 5min

# `refresh: always` rather than ESPHome's 1d default: this file and the component
# it declares below are versioned together, and a cached copy of one against a
# fresh copy of the other is exactly how you get "[option] is an invalid option
# for [fan.zehnder]" -- the new config reaching yesterday's component clone. The
# cost is a git fetch per build, and a build that needs the network -- set it
# back to 1d, here and on the package pull in your per-install config, once you
# stop following changes upstream.
external_components:
  - source: github://cdamman/ESPHome-Zehnder-RF
    refresh: always

# When the filters were last changed, as a UTC epoch, kept across reboots and
# power cuts. 0 means "not known yet" -- every entity built on it reads unknown
# rather than guessing, and the interval below seeds it on the first boot that
# has a clock.
#
# A date rather than a countdown on purpose: a filter ages in calendar time, and
# a stored deadline would drift every time the interval is changed. This keeps
# the fact ("changed on the 3rd") and derives the deadline from it.
globals:
  - id: ${devicename}_filters_changed_at
    type: uint32_t
    restore_value: true
    initial_value: "0"

# Everything filter-related needs to know what time it is, which is the one thing
# this file does not declare: `time:` lives in the per-install config (both
# committed ones use `id: homeassistant_time`, which is the id used below). A
# board with no clock yet -- no Home Assistant connection since boot -- reports
# these entities as unknown instead of counting from the epoch.
interval:
  - interval: 60s
    then:
      - lambda: |-
          if (id(${devicename}_filters_changed_at) != 0) {
            return;  // already have a reference date
          }
          auto now = id(homeassistant_time).now();
          if (!now.is_valid()) {
            return;  // no clock yet; try again next minute
          }
          // First boot with a clock: assume the filters are fresh. Anyone whose
          // filters are older presses the button, which is the same code path.
          id(${devicename}_filters_changed_at) = (uint32_t) now.timestamp;
          ESP_LOGI("filters", "No filter-change date stored; starting the count from now");

fan:
  - platform: zehnder
    id: ${devicename}_fan
    # No name: this is the device's main control, so it takes the device's own name
    # instead of adding a word to it -- your per-install config's own
    # `esphome: friendly_name:` is where that name comes from, and ESPHome requires
    # it be set for this to work.
    name: None
    icon: mdi:hvac
    nrf905: nrf905_rf
    # How often the unit is polled. Changes made elsewhere do not wait for this --
    # the radio listens continuously and decodes them as they happen -- so this is
    # what catches up after a missed frame, and what paces the self-heal counter
    # (self_heal_after polls without an answer, so ~5 min at 30 s).
    update_interval: "30s"
    # zehnder = 868.400 MHz; buva = 868.200 MHz (see the nRF905-API config).
    model: zehnder
    # The modes as they show up in Home Assistant and Google Home. No "off" among
    # them: this unit has no stop mode in practice, only three running speeds --
    # the fan entity's own on/off (the boost) is the only power control there is.
    preset_modes:
      "${mode_low}": low
      "${mode_medium}": medium
      "${mode_high}": high
    # The component advertises no speed control at all, so Home Assistant shows no
    # percentage slider: the on/off (the boost) and the modes above are the whole
    # interface. The speed is still tracked, and a mode or the set_speed service
    # still sets it.
    # The entity reads "on" at the boost speed; switching it off returns to
    # normal speed rather than stopping the unit.
    boost_speed: high
    revert_speed: medium
    boost_duration: 30min
    # The pairing (network_id / main_unit_id / my_device_id) is not pinned here: it
    # belongs to one unit, not to every install, so it goes in the config that pulls
    # this file in -- see the `!extend` block at the end of your per-install config.
    # Without it the
    # component discovers the unit on first boot and keeps the identity in flash.
    # The three sensors below are derived from the fan's state, so refresh them as
    # soon as it changes instead of waiting for their own interval -- otherwise a
    # mode change or a boost takes up to 30 s to show up in the consumption. This
    # fires on the optimistic publish too, so it does not wait for the RF reply.
    on_state:
      - component.update: ${devicename}_power
      - component.update: ${devicename}_timer_remaining
      - component.update: ${devicename}_airflow

number:
  # The integration's "timer duration" number: 1 to 240 min, kept across
  # restarts, and pushed into the component on every change.
  - platform: template
    name: "${name_timer_duration}"
    id: ${devicename}_timer_minutes
    icon: mdi:timer-cog-outline
    entity_category: config
    unit_of_measurement: min
    mode: box
    min_value: 1
    max_value: 240
    step: 1
    initial_value: 30
    optimistic: true
    restore_value: true
    # on_value (rather than set_action) also fires for the value restored at
    # boot, so the component always starts with the right duration.
    on_value:
      - lambda: "id(${devicename}_fan)->set_timer_minutes((uint8_t) x);"

  # Power drawn at each speed, in watts. The unit reports no consumption, so the
  # sensors below derive it from these -- which is why they are settable from
  # Home Assistant (the integration had them in its options) rather than baked
  # into the firmware. Kept across restarts.
  - platform: template
    name: "${name_power_low}"
    id: ${devicename}_power_low
    icon: mdi:flash-outline
    entity_category: config
    device_class: power
    unit_of_measurement: W
    mode: box
    min_value: 0
    max_value: 10000
    step: 0.5
    initial_value: ${power_low}
    optimistic: true
    restore_value: true
    on_value:
      - component.update: ${devicename}_power

  - platform: template
    name: "${name_power_medium}"
    id: ${devicename}_power_medium
    icon: mdi:flash-outline
    entity_category: config
    device_class: power
    unit_of_measurement: W
    mode: box
    min_value: 0
    max_value: 10000
    step: 0.5
    initial_value: ${power_medium}
    optimistic: true
    restore_value: true
    on_value:
      - component.update: ${devicename}_power

  - platform: template
    name: "${name_power_high}"
    id: ${devicename}_power_high
    icon: mdi:flash-outline
    entity_category: config
    device_class: power
    unit_of_measurement: W
    mode: box
    min_value: 0
    max_value: 10000
    step: 0.5
    initial_value: ${power_high}
    optimistic: true
    restore_value: true
    on_value:
      - component.update: ${devicename}_power

  # How long a set of filters lasts, in months. Three is the usual figure for a
  # ComfoFan; a clean house or a mild season stretches it, so it is a number
  # entity rather than a constant -- set it to 4 or 6 from Home Assistant and the
  # deadline moves at once, without a reflash.
  - platform: template
    name: "${name_filter_interval}"
    id: ${devicename}_filter_interval
    icon: mdi:air-filter
    entity_category: config
    unit_of_measurement: months
    mode: box
    min_value: 1
    max_value: 24
    step: 1
    initial_value: ${filter_interval_months}
    optimistic: true
    restore_value: true
    # Changing the interval moves the deadline, so recompute it now instead of
    # leaving it stale for up to a minute.
    on_value:
      - component.update: ${devicename}_filter_due_on

button:
  # No boost button: the fan entity's own on/off starts and ends the boost. A
  # boost of an unusual length is an automation setting the duration number and
  # then turning the fan on.

  # Re-pair on demand. Put the unit in its pairing window first (ComfoFan S:
  # power-cycle it for a ~10 min join window) -- pressing this drops the current
  # link and re-runs discovery, so the fan is uncontrollable until the join
  # succeeds. With the identity pinned below in `fan:`, a re-pair does not survive
  # a reboot: the pinned values are re-applied at boot.
  - platform: template
    name: "${name_pairing}"
    id: ${devicename}_pairing
    icon: mdi:link-variant
    entity_category: config
    on_press:
      - lambda: "id(${devicename}_fan)->startPairing();"

  - platform: restart
    id: ${devicename}_restart
    name: "${name_restart}"
    entity_category: config

  # Press this after changing the filters: it stores "now" as the new reference
  # date and the count-down starts over. Filed under configuration, with the other
  # buttons, so the device's controls stay down to the things you touch daily; the
  # notification action in the README presses this same entity, and an entity
  # category does not affect that.
  - platform: template
    name: "${name_filter_reset}"
    id: ${devicename}_filter_reset
    icon: mdi:air-filter
    entity_category: config
    on_press:
      - lambda: |-
          auto now = id(homeassistant_time).now();
          if (!now.is_valid()) {
            // Storing 0 would read as "never changed"; storing a bogus epoch
            // would put the next change in 1970. Refuse instead, and say why.
            ESP_LOGW("filters", "No clock yet -- not resetting the filter date. Try again once Home Assistant has connected.");
            return;
          }
          id(${devicename}_filters_changed_at) = (uint32_t) now.timestamp;
          ESP_LOGI("filters", "Filters marked as changed today; next change in %.0f months",
                   id(${devicename}_filter_interval).state);
      - component.update: ${devicename}_filter_due_on

binary_sensor:
  # Live nRF905 SPI health (idle probe + config readback on each TX).
  # ON = healthy; OFF = SPI wedged -> check the 3.3 V rail.
  #
  # No icon on purpose, unlike the RF sensors below: device_class connectivity
  # draws lan-connect / lan-disconnect and switches between the two with the
  # state, which an explicit icon would replace with a single static one.
  # Filters overdue. device_class: problem is what makes Home Assistant treat this
  # as something wrong with the device rather than a plain true/false: the value
  # reads Problem / OK, and it is the entity an automation watches to put a
  # notification on your phone (see the README). Being a diagnostic entity does not
  # change that -- a state trigger fires on it the same way.
  #
  # Reads the due-date sensor rather than repeating its arithmetic, so the two can
  # never disagree: if this says Problem, the date next to it is in the past.
  - platform: template
    name: "${name_filter_due}"
    id: ${devicename}_filter_due
    icon: mdi:air-filter
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      auto now = id(homeassistant_time).now();
      const float due_at = id(${devicename}_filter_due_on).state;
      if (!now.is_valid() || std::isnan(due_at)) {
        return {};  // no clock or no reference date yet: unknown, not "fine"
      }
      return (double) now.timestamp >= (double) due_at;

  - platform: template
    name: "${name_spi_healthy}"
    device_class: connectivity
    entity_category: diagnostic
    lambda: "return id(nrf905_rf)->getLastConfigWriteOk();"

sensor:
  # Timer count-down, in minutes. The unit only reports *that* a timer runs,
  # never the time left: the count-down therefore starts from the duration that
  # was asked for, and clears as soon as the unit reports the timer is over.
  - platform: template
    name: "${name_timer_remaining}"
    id: ${devicename}_timer_remaining
    icon: mdi:timer-sand
    device_class: duration
    unit_of_measurement: min
    accuracy_decimals: 0
    update_interval: 30s
    lambda: "return id(${devicename}_fan)->getTimerRemainingMinutes();"

  # Present consumption, derived from the speed and the figures configured above
  # (the unit does not measure it).
  - platform: template
    name: "${name_power}"
    id: ${devicename}_power
    device_class: power
    state_class: measurement
    unit_of_measurement: W
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      auto *vmc = id(${devicename}_fan);
      switch (vmc->speed) {
        // 0 is not a real speed on this unit -- it only shows up briefly at boot,
        // before the first successful poll, so it borrows the lowest figure
        // rather than get an entity of its own.
        case 0:
        case 1: return id(${devicename}_power_low).state;
        case 2: return id(${devicename}_power_medium).state;
        // Speed 4 has no mode and is unused here; should a physical remote ever
        // select it, fall back to the "Fort" figure rather than stall the total.
        default: return id(${devicename}_power_high).state;
      }

  # Daily consumption, reset at local midnight. The platform integrates watts over
  # hours, so its raw total is in Wh: the multiply filter is what makes the kWh
  # label true. Without it the value reads 1000x too high.
  - platform: total_daily_energy
    name: "${name_energy_today}"
    power_id: ${devicename}_power
    unit_of_measurement: kWh
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
    entity_category: diagnostic

  # Unit output in % (its 0-10 V control signal times ten), as the unit itself
  # reports it -- a reading, not a control: the speed is set by a mode.
  - platform: template
    name: "${name_airflow}"
    id: ${devicename}_airflow
    icon: mdi:fan
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s
    lambda: "return id(${devicename}_fan)->getFanPercentage();"

  # --- Filters -------------------------------------------------------------
  # When the filters are next due, as a date. Home Assistant renders a timestamp
  # sensor as "3 November" -- and as "in 2 months" on the cards that show relative
  # time -- so the deadline and roughly how far off it is both read from this one
  # entity.
  #
  # The one formula in this feature: the problem flag reads this sensor rather than
  # doing its own date arithmetic, so there is nothing to keep in step by hand.
  #
  # Sensor states are floats, so an epoch this size keeps only ~2-minute
  # precision -- irrelevant for a date, and the same limitation ESPHome's own
  # uptime timestamp sensor has.
  - platform: template
    name: "${name_filter_due_on}"
    id: ${devicename}_filter_due_on
    icon: mdi:calendar-end
    device_class: timestamp
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      const uint32_t changed_at = id(${devicename}_filters_changed_at);
      const float months = id(${devicename}_filter_interval).state;
      if (changed_at == 0 || std::isnan(months)) {
        return NAN;
      }
      return (float) ((double) changed_at + (double) months * ${filter_days_per_month} * 86400.0);

  # --- RF diagnostics ------------------------------------------------------
  # Each of these carries its own icon: without one, Home Assistant falls back to
  # a generic gauge for the percentages and a plain counter for the frame totals,
  # which makes the whole RF group look alike at a glance. The icons below say
  # which direction, and which kind of trouble, each one is about.
  #
  # Channel busy is not here: it needs the CD pin, which not every board wires,
  # so it lives in the per-install configs that do (utility-bridge-esp32.yaml).
  # See the note there.
  - platform: template
    name: "${name_rf_frames_received}"
    icon: mdi:download-network
    unit_of_measurement: "frames"
    accuracy_decimals: 0
    entity_category: diagnostic
    state_class: total_increasing
    update_interval: 60s
    lambda: "return id(nrf905_rf)->getRxValidCount();"
  - platform: template
    name: "${name_rf_frames_sent}"
    icon: mdi:upload-network
    unit_of_measurement: "frames"
    accuracy_decimals: 0
    entity_category: diagnostic
    state_class: total_increasing
    update_interval: 60s
    lambda: "return id(nrf905_rf)->getTxCount();"
  - platform: template
    name: "${name_rf_crc_errors}"
    # The odd one out among the frame counters, and it should look it: this is the
    # only one where a rising number is bad news.
    icon: mdi:alert-circle-outline
    unit_of_measurement: "frames"
    accuracy_decimals: 0
    entity_category: diagnostic
    state_class: total_increasing
    update_interval: 60s
    lambda: "return id(nrf905_rf)->getRxInvalidCount();"
  - platform: template
    name: "${name_poll_success}"
    icon: mdi:swap-horizontal  # a poll and its answer, the round trip this counts
    unit_of_measurement: "%"
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 60s
    lambda: "return id(${devicename}_fan)->getQuerySuccessPercent();"

  - platform: wifi_signal
    name: "${name_wifi_signal}"
    entity_category: diagnostic
    update_interval: 60s
  - platform: uptime
    type: timestamp
    name: "${name_boot_time}"
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${name_ip_address}"
      icon: mdi:ip-network
      entity_category: diagnostic

  # Current pairing identity (from flash, discovery or the YAML pin), visible
  # without having to read the logs. Copy these three into `network_id`,
  # `main_unit_id` and `my_device_id` in your per-install config to pin the pairing.
  #
  # Three hex strings that look alike and mean quite different things, which is
  # exactly how they get copied into the wrong option. So each one is drawn as the
  # thing it identifies rather than as a generic id: the network, the ventilation
  # unit (the same icon the fan entity carries), and this controller -- a remote
  # control as far as the protocol is concerned, device type 0x03.
  - platform: template
    name: "${name_network_id}"
    icon: mdi:access-point-network
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      char buf[12];
      snprintf(buf, sizeof(buf), "0x%08X", id(${devicename}_fan)->getNetworkId());
      return std::string(buf);
  - platform: template
    name: "${name_main_unit_id}"
    icon: mdi:hvac
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      char buf[6];
      snprintf(buf, sizeof(buf), "0x%02X", id(${devicename}_fan)->getMainUnitId());
      return std::string(buf);
  - platform: template
    name: "${name_controller_id}"
    icon: mdi:remote
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      char buf[6];
      snprintf(buf, sizeof(buf), "0x%02X", id(${devicename}_fan)->getMyDeviceId());
      return std::string(buf);
